[project]
name = "homescraper"
version = "0.1.0"
description = "Scrape Midtjylland houses for sale from Boligsiden, score them per kommune, explore in Streamlit"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pandas>=2.2",
    "streamlit>=1.39",
    "typer>=0.12",
    "databricks-sdk>=0.40",
    "databricks-sql-connector>=3.5",
]

[project.scripts]
homescraper = "homescraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homescraper"]
